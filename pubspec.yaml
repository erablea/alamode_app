name: alamode_app
description: "贈った・もらったお菓子を記録して、お気に入りのお菓子を検索できるアプリ「a la mode」"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: '>=3.4.3 <4.0.0'
  
dependencies:
  flutter:
    sdk: flutter

  # Supabase
  supabase_flutter: ^2.5.0
  
  # ローカルストレージ
  shared_preferences: ^2.2.3

  # 画像関連
  cached_network_image: ^3.3.1
  image: ^3.0.2
  image_picker: ^1.1.2
  path_provider: ^2.0.15

  # ユーティリティ
  syncfusion_flutter_datepicker: ^21.2.3
  intl: ^0.18.1
  http: ^0.13.5
  url_launcher: ^6.2.2
  logging: ^1.2.0

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/logo/
  fonts:
    - family: MaterialIcons
      fonts:
        - asset: assets/fonts/MaterialIcons-Regular.otf
    - family: PinyonScript
      fonts:
        - asset: assets/fonts/Pinyon_Script/PinyonScript-Regular.ttf
          weight: 400
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay/PlayfairDisplay-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlayfairDisplay/PlayfairDisplay-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/PlayfairDisplay/PlayfairDisplay-Medium.ttf
          weight: 600
        - asset: assets/fonts/PlayfairDisplay/PlayfairDisplay-MediumItalic.ttf
          weight: 600
          style: italic
    - family: ZenMaruGothic
      fonts:
        - asset: assets/fonts/ZenMaruGothic/ZenMaruGothic-Light.ttf
          weight: 200
        - asset: assets/fonts/ZenMaruGothic/ZenMaruGothic-Regular.ttf
          weight: 400
        - asset: assets/fonts/ZenMaruGothic/ZenMaruGothic-Medium.ttf
          weight: 600
        - asset: assets/fonts/ZenMaruGothic/ZenMaruGothic-Bold.ttf
          weight: 800
    - family: Corinthia
      fonts:
        - asset: assets/fonts/Corinthia/Corinthia-Regular.ttf
          weight: 400
        - asset: assets/fonts/Corinthia/Corinthia-Bold.ttf
          weight: 800
